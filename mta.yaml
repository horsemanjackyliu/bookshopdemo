_schema-version: 3.3.0
ID: bookshopdemo
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: bookshopdemo-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: bookshopdemo-auth
      - name: bookshopdemo-db
      - name: bookshopdemo-destination

  - name: bookshopdemo-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: bookshopdemo-db

  - name: bookshopdemo-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: bookshopdemo-auth
      - name: srv-api
      - name: bookshopdemo-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: app/
      requires:
        - name: bookshopdemoadminauthors
          artifacts:
            - admin-authors.zip
          target-path: app/
        - name: bookshopdemoadminbooks
          artifacts:
            - admin-books.zip
          target-path: app/
        - name: bookshopdemobrowse
          artifacts:
            - browse.zip
          target-path: app/
        - name: bookshopdemogenres
          artifacts:
            - genres.zip
          target-path: app/

  - name: bookshopdemoadminauthors
    type: html5
    path: app/admin-authors
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: bookshopdemoadminbooks
    type: html5
    path: app/admin-books
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: bookshopdemobrowse
    type: html5
    path: app/browse
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: bookshopdemogenres
    type: html5
    path: app/genres
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: bookshopdemo-destinations
    type: com.sap.application.content
    requires:
      - name: bookshopdemo-auth
        parameters:
          service-key:
            name: bookshopdemo-auth-key
      - name: bookshopdemo-html5-repo-host
        parameters:
          service-key:
            name: bookshopdemo-html5-repo-host-key
      - name: srv-api
      - name: bookshopdemo-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: bookshopdemo-html5-repository
              ServiceInstanceName: bookshopdemo-html5-repo-host
              ServiceKeyName: bookshopdemo-html5-repo-host-key
              sap.cloud.service: bookshopdemo.service
            - Name: bookshopdemo-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: bookshopdemo-auth
              ServiceKeyName: bookshopdemo-auth-key
              sap.cloud.service: bookshopdemo.service

resources:
  - name: bookshopdemo-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: bookshopdemo-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'admin (bookshopdemo ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.admin'
  - name: bookshopdemo-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: bookshopdemo-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
    requires:
      - name: srv-api

  - name: bookshopdemo-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
